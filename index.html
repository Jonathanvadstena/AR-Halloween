<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AR-skattjakt</title>
    <!-- A-Frame MÅSTE laddas före MindAR -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
      body { margin: 0; overflow: hidden; }
    </style>
  </head>
  <body>
    <a-scene
      mindar-image="
        imageTargetSrc: targets.mind;
        autoStart: true;
      "
      color-space="sRGB"
      renderer="colorManagement: true"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >
      <!-- Kamera (ändra inte) -->
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- ============================================================
           BILD N°1 → SLIME
           targetIndex="0" = den 1:a bilden i targets.mind
           ============================================================ -->
      <a-entity mindar-image-target="targetIndex: 0">
        <a-gltf-model
          src="slime.glb"
          position="0 0 0"
          scale="0.5 0.5 0.5"
          rotation="0 0 0"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 4000; easing: linear"
        ></a-gltf-model>
        <a-text
          value="Station 1 - Du hittade slemmet!"
          position="0 -0.6 0"
          scale="0.5 0.5 0.5"
          align="center"
          color="#ffffff"
        ></a-text>
      </a-entity>

      <!-- ============================================================
           BILD N°2 → SPÖK
           targetIndex="1" = den 2:a bilden i targets.mind
           ============================================================ -->
      <a-entity mindar-image-target="targetIndex: 1">
        <a-gltf-model
          src="spök.glb"
          position="0 0 0"
          scale="0.5 0.5 0.5"
          rotation="0 0 0"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 3000; easing: linear"
        ></a-gltf-model>
        <a-text
          value="Station 2 - Ett spöke dyker upp!"
          position="0 -0.6 0"
          scale="0.5 0.5 0.5"
          align="center"
          color="#ffffff"
        ></a-text>
      </a-entity>

    </a-scene>
  </body>
</html>
