<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AR-skattjakt</title>
    <!-- A-Frame MÅSTE laddas före MindAR -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
      body { margin: 0; overflow: hidden; }
      #start {
        position: fixed; inset: 0; z-index: 10000;
        display: flex; align-items: center; justify-content: center;
        background: rgba(0, 0, 0, 0.85); color: #fff;
        font: 600 24px sans-serif; text-align: center; padding: 24px;
      }
    </style>
    <script>
      // Spelar ljud när bilden hittas. cooldown = paus i ms innan ljudet kan spelas igen.
      var allAudios = [];
      AFRAME.registerComponent("sound-on-found", {
        schema: { src: { type: "string" }, cooldown: { default: 5000 } },
        init: function () {
          var self = this;
          this.audio = new Audio(this.data.src);
          this.audio.preload = "auto";
          this.last = 0;
          allAudios.push(this.audio);
          this.el.addEventListener("targetFound", function () {
            var now = Date.now();
            if (now - self.last < self.data.cooldown) return;
            self.last = now;
            self.audio.currentTime = 0;
            self.audio.play().catch(function () {});
          });
        }
      });
      // iPhone kräver ett tryck innan ljud får spelas: ett enda tryck låser upp alla ljud.
      window.addEventListener("load", function () {
        var start = document.getElementById("start");
        function unlock() {
          allAudios.forEach(function (a) {
            a.play().then(function () { a.pause(); a.currentTime = 0; }).catch(function () {});
          });
          start.style.display = "none";
        }
        start.addEventListener("click", unlock);
        start.addEventListener("touchend", function (e) { e.preventDefault(); unlock(); });
      });
    </script>
  </head>
  <body>
    <div id="start">Tryck för att starta</div>
    <a-scene
      mindar-image="
        imageTargetSrc: targets.mind;
        autoStart: true;
        filterMinCF: 0.0001;
        filterBeta: 1000;
        missTolerance: 10;
        warmupTolerance: 5;
      "
      color-space="sRGB"
      renderer="colorManagement: true"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >
      <!-- Kamera (ändra inte) -->
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- targetIndex = bildens ordning i targets.mind (börjar på 0) -->
      <!-- sound-on-found = ljud som spelas när bilden hittas (paus 5 s mellan två uppspelningar) -->
      <!-- Rotation: dur = tid för ett varv i ms (större = långsammare) -->

      <!-- BILD 1 → PUMPA -->
      <a-entity mindar-image-target="targetIndex: 0" sound-on-found="src: pumpa.mp3">
        <a-entity animation="property: rotation; to: 0 -360 0; loop: true; dur: 15000; easing: linear">
          <a-gltf-model
            src="pumpa.glb"
            position="0 0 0"
            scale="5 5 5"
          ></a-gltf-model>
        </a-entity>
        <a-text
          value="Station 1 - Du hittade pumpan!"
          position="0 -0.6 0"
          scale="0.5 0.5 0.5"
          align="center"
          color="#ffffff"
        ></a-text>
      </a-entity>

      <!-- BILD 2 → PIRATSKALLE -->
      <a-entity mindar-image-target="targetIndex: 1" sound-on-found="src: piratskalle.mp3">
        <a-entity animation="property: rotation; to: 0 -360 0; loop: true; dur: 15000; easing: linear">
          <a-gltf-model
            src="piratskalle.glb"
            position="0.5 -5.7 1.2"
            scale="5 5 5"
          ></a-gltf-model>
        </a-entity>
        <a-text
          value="Station 2 - Piratskallen vaktar skatten!"
          position="0 -0.6 0"
          scale="0.5 0.5 0.5"
          align="center"
          color="#ffffff"
        ></a-text>
      </a-entity>

      <!-- BILD 3 → HÄXA -->
      <a-entity mindar-image-target="targetIndex: 2" sound-on-found="src: häxa.mp3">
        <a-entity animation="property: rotation; to: 0 -360 0; loop: true; dur: 15000; easing: linear">
          <a-gltf-model
            src="häxa.glb"
            position="0 0 0"
            scale="3 3 3"
          ></a-gltf-model>
        </a-entity>
        <a-text
          value="Station 3 - En häxa flyger förbi!"
          position="0 -0.6 0"
          scale="0.5 0.5 0.5"
          align="center"
          color="#ffffff"
        ></a-text>
      </a-entity>

      <!-- BILD 4 → VAMPIRE -->
      <a-entity mindar-image-target="targetIndex: 3" sound-on-found="src: vampire.mp3">
        <a-entity animation="property: rotation; to: 0 -360 0; loop: true; dur: 15000; easing: linear">
          <a-gltf-model
            src="vampire.glb"
            position="0 0 -1.28"
            scale="5 5 5"
          ></a-gltf-model>
        </a-entity>
        <a-text
          value="Station 4 - Se upp för tänderna!"
          position="0 -0.6 0"
          scale="0.5 0.5 0.5"
          align="center"
          color="#ffffff"
        ></a-text>
      </a-entity>

      <!-- BILD 5 → TROLL -->
      <a-entity mindar-image-target="targetIndex: 4" sound-on-found="src: troll.mp3">
        <a-entity animation="property: rotation; to: 0 -360 0; loop: true; dur: 15000; easing: linear">
          <a-gltf-model
            src="troll.glb"
            position="0 0 -2.05"
            scale="8 8 8"
          ></a-gltf-model>
        </a-entity>
        <a-text
          value="Station 5 - En hand sträcker sig mot dig!"
          position="0 -0.6 0"
          scale="0.5 0.5 0.5"
          align="center"
          color="#ffffff"
        ></a-text>
      </a-entity>

      <!-- BILD 6 → WW -->
      <a-entity mindar-image-target="targetIndex: 5" sound-on-found="src: ww.mp3">
        <a-entity animation="property: rotation; to: 0 -360 0; loop: true; dur: 15000; easing: linear">
          <a-gltf-model
            src="ww.glb"
            position="0 -0.97 0.41"
            scale="0.005 0.005 0.005"
          ></a-gltf-model>
        </a-entity>
        <a-text
          value="Station 6 - Vassa klor!"
          position="0 -0.6 0"
          scale="0.5 0.5 0.5"
          align="center"
          color="#ffffff"
        ></a-text>
      </a-entity>

      <!-- BILD 7 → SPÖKE -->
      <a-entity mindar-image-target="targetIndex: 6" sound-on-found="src: spöke.mp3">
        <a-entity animation="property: rotation; to: 0 -360 0; loop: true; dur: 15000; easing: linear">
          <a-gltf-model
            src="spöke.glb"
            position="0 0 -1.28"
            scale="5 5 5"
          ></a-gltf-model>
        </a-entity>
        <a-text
          value="Station 7 - Ett spöke dyker upp!"
          position="0 -0.6 0"
          scale="0.5 0.5 0.5"
          align="center"
          color="#ffffff"
        ></a-text>
      </a-entity>

      <!-- BILD 8 → ZOMBIE -->
      <a-entity mindar-image-target="targetIndex: 7" sound-on-found="src: zombie.mp3">
        <a-entity animation="property: rotation; to: 0 -360 0; loop: true; dur: 15000; easing: linear">
          <a-gltf-model
            src="zombie.glb"
            position="2.55 -1.44 0.03"
            scale="1 1 1"
          ></a-gltf-model>
        </a-entity>
        <a-text
          value="Station 8 - Viruset har spridit sig!"
          position="0 -0.6 0"
          scale="0.5 0.5 0.5"
          align="center"
          color="#ffffff"
        ></a-text>
      </a-entity>

    </a-scene>
  </body>
</html>
