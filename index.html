<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AR-skattjakt</title>
    <!-- A-Frame MÅSTE laddas före MindAR -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
      body { margin: 0; overflow: hidden; }
    </style>
  </head>
  <body>
    <a-scene
      mindar-image="
        imageTargetSrc: targets.mind;
        autoStart: true;
        filterMinCF: 0.0001;
        filterBeta: 1000;
        missTolerance: 10;
        warmupTolerance: 5;
      "
      color-space="sRGB"
      renderer="colorManagement: true"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >
      <!-- Kamera (ändra inte) -->
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- targetIndex = bildens ordning i targets.mind (börjar på 0) -->

      <!-- BILD 1 → PUMPA -->
      <a-entity mindar-image-target="targetIndex: 0">
        <a-gltf-model
          src="pumpa.glb"
          position="0 0 0"
          scale="2.5 2.5 2.5"
          rotation="0 0 0"
        ></a-gltf-model>
        <a-text
          value="Station 1 - Du hittade pumpan!"
          position="0 -0.6 0"
          scale="0.5 0.5 0.5"
          align="center"
          color="#ffffff"
        ></a-text>
      </a-entity>

      <!-- BILD 2 → PIRATSKALLE -->
      <a-entity mindar-image-target="targetIndex: 1">
        <a-gltf-model
          src="piratskalle.glb"
          position="0 -0.5 0"
          scale="5 5 5"
          rotation="0 0 0"
        ></a-gltf-model>
        <a-text
          value="Station 2 - Piratskallen vaktar skatten!"
          position="0 -0.6 0"
          scale="0.5 0.5 0.5"
          align="center"
          color="#ffffff"
        ></a-text>
      </a-entity>

      <!-- BILD 3 → HÄXA -->
      <a-entity mindar-image-target="targetIndex: 2">
        <a-gltf-model
          src="häxa.glb"
          position="0 0 0"
          scale="2.5 2.5 2.5"
          rotation="0 0 0"
        ></a-gltf-model>
        <a-text
          value="Station 3 - En häxa flyger förbi!"
          position="0 -0.6 0"
          scale="0.5 0.5 0.5"
          align="center"
          color="#ffffff"
        ></a-text>
      </a-entity>

      <!-- BILD 4 → VAMPIRE -->
      <a-entity mindar-image-target="targetIndex: 3">
        <a-gltf-model
          src="vampire.glb"
          position="0 0 0"
          scale="2.5 2.5 2.5"
          rotation="0 0 0"
        ></a-gltf-model>
        <a-text
          value="Station 4 - Se upp för tänderna!"
          position="0 -0.6 0"
          scale="0.5 0.5 0.5"
          align="center"
          color="#ffffff"
        ></a-text>
      </a-entity>

      <!-- BILD 5 → TROLL -->
      <a-entity mindar-image-target="targetIndex: 4">
        <a-gltf-model
          src="troll.glb"
          position="0 0 0"
          scale="2.5 2.5 2.5"
          rotation="0 0 0"
        ></a-gltf-model>
        <a-text
          value="Station 5 - En hand sträcker sig mot dig!"
          position="0 -0.6 0"
          scale="0.5 0.5 0.5"
          align="center"
          color="#ffffff"
        ></a-text>
      </a-entity>

      <!-- BILD 6 → WW -->
      <a-entity mindar-image-target="targetIndex: 5">
        <a-gltf-model
          src="ww.glb"
          position="0 0 0"
          scale="2.5 2.5 2.5"
          rotation="0 0 0"
        ></a-gltf-model>
        <a-text
          value="Station 6 - Vassa klor!"
          position="0 -0.6 0"
          scale="0.5 0.5 0.5"
          align="center"
          color="#ffffff"
        ></a-text>
      </a-entity>

      <!-- BILD 7 → SPÖKE -->
      <a-entity mindar-image-target="targetIndex: 6">
        <a-gltf-model
          src="spöke.glb"
          position="0 0 0"
          scale="2.5 2.5 2.5"
          rotation="0 0 0"
        ></a-gltf-model>
        <a-text
          value="Station 7 - Ett spöke dyker upp!"
          position="0 -0.6 0"
          scale="0.5 0.5 0.5"
          align="center"
          color="#ffffff"
        ></a-text>
      </a-entity>

      <!-- BILD 8 → ZOMBIE -->
      <a-entity mindar-image-target="targetIndex: 7">
        <a-gltf-model
          src="zombie.glb"
          position="0.5 0 0"
          scale="2.5 2.5 2.5"
          rotation="0 0 0"
        ></a-gltf-model>
        <a-text
          value="Station 8 - Viruset har spridit sig!"
          position="0 -0.6 0"
          scale="0.5 0.5 0.5"
          align="center"
          color="#ffffff"
        ></a-text>
      </a-entity>

    </a-scene>
  </body>
</html>
